name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        default: production
        type: choice
        options: [production, staging]
      criar_role_de_autenticacao:
        description: >-
          Executar sql/auth-database-role.sql apos o apply.
          So marque depois que as migrations Flyway V18..V20 do mechanical-hub
          tiverem rodado — elas criam users.document_number.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.5
  TF_DIR: infra

jobs:
  deploy:
    name: Provisionar banco de dados
    runs-on: ubuntu-latest

    outputs:
      rds-endpoint: ${{ steps.tf-outputs.outputs.rds_endpoint }}
      rds-port: ${{ steps.tf-outputs.outputs.rds_port }}
      rds-db-name: ${{ steps.tf-outputs.outputs.rds_db_name }}
      eks-cluster-name: ${{ steps.tf-outputs.outputs.eks_cluster_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Definir variaveis de state
        id: state
        run: |
          BUCKET="mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_OUTPUT

      - name: Garantir bucket de state
        run: |
          aws s3api create-bucket \
            --bucket ${{ steps.state.outputs.bucket }} \
            --region ${{ env.AWS_REGION }} || true

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=mechanical-hub-database/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_infra_state_bucket: ${{ steps.state.outputs.bucket }}
          TF_VAR_environment: ${{ steps.state.outputs.environment }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar outputs do contrato
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "rds_port=$(terraform output -raw rds_port)" >> $GITHUB_OUTPUT
          echo "rds_db_name=$(terraform output -raw rds_db_name)" >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT

      - name: Resumo
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Banco provisionado"
            echo ""
            echo "| Output | Valor |"
            echo "| --- | --- |"
            echo "| rds_endpoint | \`$(terraform output -raw rds_endpoint)\` |"
            echo "| rds_port | \`$(terraform output -raw rds_port)\` |"
            echo "| rds_db_name | \`$(terraform output -raw rds_db_name)\` |"
            echo ""
            echo "State: \`s3://${{ steps.state.outputs.bucket }}/mechanical-hub-database/terraform.tfstate\`"
            echo ""
            echo "Consumidores (ADR-0002): \`mechanical-hub-auth\` e o pipeline de deploy de \`mechanical-hub\`."
          } >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Role de banco da autenticacao — opcional, sob demanda
  # ===========================================================================
  #
  # ADR-0002 atribui a este repositorio a definicao do usuario de banco com
  # privilegio minimo usado pela autenticacao. O script correspondente esta em
  # sql/auth-database-role.sql.
  #
  # NAO roda no push: depende das migrations Flyway V18, V19 e V20 do
  # `mechanical-hub`, que criam e populam `users.document_number`. Rodar antes
  # delas falha no GRANT por coluna. Por isso o job so e acionado marcando
  # "criar_role_de_autenticacao" em Actions -> Deploy -> Run workflow.
  #
  # O script e idempotente: em execucoes seguintes apenas atualiza a senha.
  #
  # O psql NAO roda direto neste runner: o RDS e privado (publicly_accessible
  # = false, o security group so libera as subnets privadas — ADR-0002) e o
  # runner hospedado do GitHub Actions esta na internet publica, entao a
  # conexao sempre da "Connection timed out" na 5432, senha certa ou nao. Em
  # vez de abrir o banco para a internet (contradiria a decisao do ADR-0002 e
  # os IPs dos runners do GitHub mudam demais para colocar em allowlist), o
  # script roda como um Job de curta duracao dentro do EKS, que ja esta na
  # mesma rede privada que o RDS aceita — a mesma rede de onde o mechanical-hub
  # ja consegue conectar hoje.
  auth-role:
    name: Criar role de autenticacao no banco
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.criar_role_de_autenticacao

    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets obrigatorios
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
        run: |
          faltando=""
          [ -z "${DB_PASSWORD}" ]      && faltando="${faltando} DB_PASSWORD"
          [ -z "${AUTH_DB_PASSWORD}" ] && faltando="${faltando} AUTH_DB_PASSWORD"
          if [ -n "${faltando}" ]; then
            echo "::error::Secret(s) ausente(s):${faltando}"
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.deploy.outputs.eks-cluster-name }} \
            --region ${{ env.AWS_REGION }}

      - name: Executar sql/auth-database-role.sql via Job no EKS
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
          PGHOST: ${{ needs.deploy.outputs.rds-endpoint }}
          PGPORT: ${{ needs.deploy.outputs.rds-port }}
          PGDATABASE: ${{ needs.deploy.outputs.rds-db-name }}
        run: |
          set -euo pipefail
          NAMESPACE=production
          echo "Alvo: ${PGHOST}:${PGPORT}/${PGDATABASE} (via Job no namespace ${NAMESPACE})"

          # Idempotente mesmo se este job rodar antes do primeiro deploy do
          # mechanical-hub (namespace ainda nao existiria).
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          # Limpa uma execucao anterior: Job e imutavel apos criado, um re-run
          # sem isso falha com "already exists".
          kubectl delete job auth-role-job -n "$NAMESPACE" --ignore-not-found
          kubectl delete secret auth-role-job-secret -n "$NAMESPACE" --ignore-not-found
          kubectl delete configmap auth-role-sql -n "$NAMESPACE" --ignore-not-found

          kubectl create configmap auth-role-sql \
            --namespace "$NAMESPACE" \
            --from-file=auth-database-role.sql=sql/auth-database-role.sql

          # Secret efemero: some no step de limpeza abaixo, esteja o job em
          # sucesso ou falha.
          kubectl create secret generic auth-role-job-secret \
            --namespace "$NAMESPACE" \
            --from-literal=db-password="${DB_PASSWORD}" \
            --from-literal=auth-db-password="${AUTH_DB_PASSWORD}"

          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: auth-role-job
            namespace: ${NAMESPACE}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: psql
                    # Mirror da AWS para o postgres oficial: evita o rate limit
                    # do Docker Hub para pulls anonimos.
                    image: public.ecr.aws/docker/library/postgres:16-alpine
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -e
                        faltantes=\$(psql -tAc "
                          SELECT string_agg(t, ', ')
                            FROM unnest(ARRAY['users','profiles']) AS t
                           WHERE to_regclass('public.' || t) IS NULL
                        ")
                        if [ -n "\$faltantes" ]; then
                          echo "Tabela(s) inexistente(s): \$faltantes. Rode as migrations Flyway do mechanical-hub antes deste job." >&2
                          exit 1
                        fi
                        if ! psql -tAc "SELECT 1 FROM information_schema.columns WHERE table_name='users' AND column_name='document_number'" | grep -q 1; then
                          echo "users.document_number nao existe. As migrations V18..V20 ainda nao foram aplicadas." >&2
                          exit 1
                        fi
                        psql -v ON_ERROR_STOP=1 -v auth_password="\$AUTH_DB_PASSWORD" -f /sql/auth-database-role.sql
                    env:
                      - name: PGHOST
                        value: "${PGHOST}"
                      - name: PGPORT
                        value: "${PGPORT}"
                      - name: PGDATABASE
                        value: "${PGDATABASE}"
                      - name: PGUSER
                        value: "mechanical_hub"
                      - name: PGSSLMODE
                        value: "require"
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: auth-role-job-secret
                            key: db-password
                      - name: AUTH_DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: auth-role-job-secret
                            key: auth-db-password
                    volumeMounts:
                      - name: sql-script
                        mountPath: /sql
                volumes:
                  - name: sql-script
                    configMap:
                      name: auth-role-sql
          EOF

          set +e
          kubectl wait --for=condition=complete --timeout=180s "job/auth-role-job" -n "$NAMESPACE"
          WAIT_STATUS=$?
          set -e

          echo "=== Logs do Job ==="
          kubectl logs job/auth-role-job -n "$NAMESPACE" --tail=200 || true

          if [ "$WAIT_STATUS" -ne 0 ]; then
            echo "::error::Job auth-role-job nao completou com sucesso. Ver logs acima."
            exit 1
          fi

      - name: Limpar recursos do Job
        if: always()
        run: |
          NAMESPACE=production
          kubectl delete job auth-role-job -n "$NAMESPACE" --ignore-not-found
          kubectl delete secret auth-role-job-secret -n "$NAMESPACE" --ignore-not-found
          kubectl delete configmap auth-role-sql -n "$NAMESPACE" --ignore-not-found

      - name: Resumo
        run: |
          {
            echo "### Role de autenticacao"
            echo ""
            echo "\`mechanical_hub_auth\` criada ou atualizada em \`${{ needs.deploy.outputs.rds-db-name }}\`."
            echo ""
            echo "Privilegio: \`SELECT\` em \`profiles\` e nas seis colunas de \`users\` usadas pelo login. Nada mais."
            echo ""
            echo "Proximo passo: deploy do \`mechanical-hub-auth\` com \`TF_VAR_database_password\` igual ao secret \`AUTH_DB_PASSWORD\`."
          } >> $GITHUB_STEP_SUMMARY