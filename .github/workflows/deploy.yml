name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        default: production
        type: choice
        options: [production, staging]
      mongodb_persistencia:
        description: >-
          MongoDB em PVC (EBS gp3). Desmarque se o driver EBS CSI nao
          funcionar no Lab — cai para emptyDir.
        required: false
        default: true
        type: boolean
      criar_usuarios_e_role:
        description: >-
          Executar sql/service-user.sql nas 3 instancias e
          sql/auth-database-role.sql na do orders apos o apply. Necessario
          antes do primeiro deploy dos servicos (e a cada recriacao dos RDS).
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.5
  TF_DIR: infra

jobs:
  deploy:
    name: Provisionar bancos de dados
    runs-on: ubuntu-latest

    # Valores do contrato (secao 3 da spec) para quem consome este workflow.
    # `databases` e `auth_database` saem como JSON compacto.
    outputs:
      databases: ${{ steps.tf-outputs.outputs.databases }}
      auth-database: ${{ steps.tf-outputs.outputs.auth_database }}
      mongodb-host: ${{ steps.tf-outputs.outputs.mongodb_host }}
      mongodb-port: ${{ steps.tf-outputs.outputs.mongodb_port }}
      mongodb-replica-set: ${{ steps.tf-outputs.outputs.mongodb_replica_set }}
      mongodb-database: ${{ steps.tf-outputs.outputs.mongodb_database }}
      mongodb-secret-name: ${{ steps.tf-outputs.outputs.mongodb_secret_name }}
      eks-cluster-name: ${{ steps.tf-outputs.outputs.eks_cluster_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets obrigatorios
        env:
          DB_PASSWORD_ORDERS: ${{ secrets.DB_PASSWORD_ORDERS }}
          DB_PASSWORD_STOCK: ${{ secrets.DB_PASSWORD_STOCK }}
          DB_PASSWORD_BILLING: ${{ secrets.DB_PASSWORD_BILLING }}
        run: |
          faltando=""
          for nome in DB_PASSWORD_ORDERS DB_PASSWORD_STOCK DB_PASSWORD_BILLING; do
            if [ -z "${!nome}" ]; then faltando="${faltando} ${nome}"; fi
          done
          if [ -n "${faltando}" ]; then
            echo "::error::Secret(s) ausente(s):${faltando}"
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Definir variaveis de state
        id: state
        run: |
          BUCKET="mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_OUTPUT
          # No push nao ha inputs: persistencia ligada (padrao da variavel).
          echo "mongodb_persistence=${{ github.event_name != 'workflow_dispatch' || inputs.mongodb_persistencia }}" >> $GITHUB_OUTPUT

      - name: Garantir bucket de state
        run: |
          aws s3api create-bucket \
            --bucket ${{ steps.state.outputs.bucket }} \
            --region ${{ env.AWS_REGION }} || true

      # O provider kubernetes (MongoDB) se autentica com `aws eks get-token`
      # sobre o cluster lido do state do mechanical-hub-infra. O kubeconfig
      # aqui serve para falhar cedo, com mensagem clara, se o cluster nao
      # existir ou nao responder — e deixa o kubectl pronto para diagnostico.
      - name: Configurar kubeconfig do cluster do infra
        run: |
          set -euo pipefail
          CLUSTER=$(aws s3 cp "s3://${{ steps.state.outputs.bucket }}/mechanical-hub-infra/terraform.tfstate" - \
            | jq -r '.outputs.eks_cluster_name.value // empty')
          if [ -z "$CLUSTER" ]; then
            echo "::error::eks_cluster_name nao encontrado no state do mechanical-hub-infra. Aplique o infra antes deste repositorio."
            exit 1
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region ${{ env.AWS_REGION }}
          kubectl get nodes -o wide

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=mechanical-hub-database/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          DB_PASSWORD_ORDERS: ${{ secrets.DB_PASSWORD_ORDERS }}
          DB_PASSWORD_STOCK: ${{ secrets.DB_PASSWORD_STOCK }}
          DB_PASSWORD_BILLING: ${{ secrets.DB_PASSWORD_BILLING }}
          TF_VAR_infra_state_bucket: ${{ steps.state.outputs.bucket }}
          TF_VAR_environment: ${{ steps.state.outputs.environment }}
          TF_VAR_mongodb_persistence_enabled: ${{ steps.state.outputs.mongodb_persistence }}
        run: |
          # Uma senha master por instancia (variavel db_passwords). O jq monta o
          # JSON com o escape correto, seja qual for o conteudo das senhas.
          export TF_VAR_db_passwords=$(jq -cn \
            --arg orders "$DB_PASSWORD_ORDERS" \
            --arg stock "$DB_PASSWORD_STOCK" \
            --arg billing "$DB_PASSWORD_BILLING" \
            '{orders: $orders, stock: $stock, billing: $billing}')
          terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar outputs do contrato
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "databases=$(terraform output -json databases | jq -c .)" >> $GITHUB_OUTPUT
          echo "auth_database=$(terraform output -json auth_database | jq -c .)" >> $GITHUB_OUTPUT
          echo "mongodb_host=$(terraform output -raw mongodb_host)" >> $GITHUB_OUTPUT
          echo "mongodb_port=$(terraform output -raw mongodb_port)" >> $GITHUB_OUTPUT
          echo "mongodb_replica_set=$(terraform output -raw mongodb_replica_set)" >> $GITHUB_OUTPUT
          echo "mongodb_database=$(terraform output -raw mongodb_database)" >> $GITHUB_OUTPUT
          echo "mongodb_secret_name=$(terraform output -raw mongodb_secret_name)" >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT

      - name: Resumo
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Bancos provisionados"
            echo ""
            echo "| Servico | Endpoint | Porta | Banco | Usuario da aplicacao |"
            echo "| --- | --- | --- | --- | --- |"
            terraform output -json databases \
              | jq -r 'to_entries[] | "| \(.key) | `\(.value.endpoint)` | \(.value.port) | `\(.value.db_name)` | `\(.value.app_username)` |"'
            echo ""
            echo "auth_database: \`$(terraform output -json auth_database | jq -r '"\(.endpoint):\(.port)/\(.db_name)"')\`"
            echo ""
            echo "| MongoDB | Valor |"
            echo "| --- | --- |"
            echo "| mongodb_host | \`$(terraform output -raw mongodb_host)\` |"
            echo "| mongodb_port | \`$(terraform output -raw mongodb_port)\` |"
            echo "| mongodb_replica_set | \`$(terraform output -raw mongodb_replica_set)\` |"
            echo "| mongodb_database | \`$(terraform output -raw mongodb_database)\` |"
            echo "| mongodb_secret_name | \`$(terraform output -raw mongodb_namespace)/$(terraform output -raw mongodb_secret_name)\` |"
            echo ""
            echo "State: \`s3://${{ steps.state.outputs.bucket }}/mechanical-hub-database/terraform.tfstate\`"
            echo ""
            echo "Consumidores (ADR-0002): pipelines de \`orders\`, \`stock\`, \`billing\` e \`orchestrator\`, e \`mechanical-hub-auth\`."
            echo ""
            echo "Proximo passo no primeiro apply: Run workflow com \`criar_usuarios_e_role\` antes do deploy dos servicos."
          } >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Usuarios dos servicos e role de autenticacao — opcional, sob demanda
  # ===========================================================================
  #
  # Roda, em cada instancia RDS do output `databases`:
  #   - sql/service-user.sql      : usuario da aplicacao, dono do schema public
  #                                 (senha: secret <SERVICO>_DB_APP_PASSWORD);
  #   - sql/auth-database-role.sql: so na instancia do orders, role
  #                                 mechanical_hub_auth com LOGIN e CONNECT
  #                                 (senha: secret AUTH_DB_PASSWORD).
  #
  # Ordem do ambiente: apply -> este job -> deploy dos servicos. As migrations
  # do orders concedem o SELECT a mechanical_hub_auth e precisam da role.
  #
  # Os scripts sao idempotentes: em execucoes seguintes apenas atualizam senhas.
  #
  # O psql NAO roda direto neste runner: os RDS sao privados (publicly_accessible
  # = false, o security group so libera as subnets privadas — ADR-0002) e o
  # runner hospedado do GitHub Actions esta na internet publica, entao a
  # conexao sempre da "Connection timed out" na 5432. Os scripts rodam como
  # Jobs de curta duracao dentro do EKS, que ja esta na rede privada que os
  # bancos aceitam.
  database-users:
    name: Criar usuarios dos servicos e role de autenticacao
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.criar_usuarios_e_role

    env:
      NAMESPACE: mechanical-hub-db-jobs

    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets obrigatorios
        env:
          DB_PASSWORD_ORDERS: ${{ secrets.DB_PASSWORD_ORDERS }}
          DB_PASSWORD_STOCK: ${{ secrets.DB_PASSWORD_STOCK }}
          DB_PASSWORD_BILLING: ${{ secrets.DB_PASSWORD_BILLING }}
          ORDERS_DB_APP_PASSWORD: ${{ secrets.ORDERS_DB_APP_PASSWORD }}
          STOCK_DB_APP_PASSWORD: ${{ secrets.STOCK_DB_APP_PASSWORD }}
          BILLING_DB_APP_PASSWORD: ${{ secrets.BILLING_DB_APP_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
        run: |
          faltando=""
          for nome in DB_PASSWORD_ORDERS DB_PASSWORD_STOCK DB_PASSWORD_BILLING \
                      ORDERS_DB_APP_PASSWORD STOCK_DB_APP_PASSWORD BILLING_DB_APP_PASSWORD \
                      AUTH_DB_PASSWORD; do
            if [ -z "${!nome}" ]; then faltando="${faltando} ${nome}"; fi
          done
          if [ -n "${faltando}" ]; then
            echo "::error::Secret(s) ausente(s):${faltando}"
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Os enderecos vem direto do state: o mapa `databases` nao cabe nos
      # outputs de job sem serializacao, e assim o job nao depende de como o
      # job de deploy publica os valores.
      - name: Ler outputs do state
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=mechanical-hub-database/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform output -json > "${RUNNER_TEMP}/tf-outputs.json"
          jq -r '.databases.value | to_entries[] | "\(.key): \(.value.endpoint)/\(.value.db_name) (\(.value.app_username))"' \
            "${RUNNER_TEMP}/tf-outputs.json"

      - name: Configurar kubectl
        run: |
          CLUSTER=$(jq -r '.eks_cluster_name.value // empty' "${RUNNER_TEMP}/tf-outputs.json")
          if [ -z "$CLUSTER" ]; then
            echo "::error::eks_cluster_name vazio: o state do mechanical-hub-infra nao foi lido no apply."
            exit 1
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region ${{ env.AWS_REGION }}

      - name: Executar scripts de sql/ via Jobs no EKS
        env:
          DB_PASSWORD_ORDERS: ${{ secrets.DB_PASSWORD_ORDERS }}
          DB_PASSWORD_STOCK: ${{ secrets.DB_PASSWORD_STOCK }}
          DB_PASSWORD_BILLING: ${{ secrets.DB_PASSWORD_BILLING }}
          ORDERS_DB_APP_PASSWORD: ${{ secrets.ORDERS_DB_APP_PASSWORD }}
          STOCK_DB_APP_PASSWORD: ${{ secrets.STOCK_DB_APP_PASSWORD }}
          BILLING_DB_APP_PASSWORD: ${{ secrets.BILLING_DB_APP_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
        run: |
          set -euo pipefail
          OUTPUTS="${RUNNER_TEMP}/tf-outputs.json"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete configmap db-users-sql -n "$NAMESPACE" --ignore-not-found
          kubectl create configmap db-users-sql \
            --namespace "$NAMESPACE" \
            --from-file=service-user.sql=sql/service-user.sql \
            --from-file=auth-database-role.sql=sql/auth-database-role.sql

          falhas=""
          for SERVICE in $(jq -r '.databases.value | keys[]' "$OUTPUTS"); do
            UPPER=$(echo "$SERVICE" | tr '[:lower:]' '[:upper:]')
            MASTER_VAR="DB_PASSWORD_${UPPER}"
            APP_VAR="${UPPER}_DB_APP_PASSWORD"
            if [ -z "${!MASTER_VAR:-}" ] || [ -z "${!APP_VAR:-}" ]; then
              echo "::error::Sem secrets ${MASTER_VAR}/${APP_VAR} para o servico ${SERVICE}."
              falhas="${falhas} ${SERVICE}"
              continue
            fi

            PGHOST=$(jq -r --arg s "$SERVICE" '.databases.value[$s].endpoint' "$OUTPUTS")
            PGPORT=$(jq -r --arg s "$SERVICE" '.databases.value[$s].port' "$OUTPUTS")
            PGDATABASE=$(jq -r --arg s "$SERVICE" '.databases.value[$s].db_name' "$OUTPUTS")
            APP_USER=$(jq -r --arg s "$SERVICE" '.databases.value[$s].app_username' "$OUTPUTS")
            PGUSER=$(jq -r --arg s "$SERVICE" '.rds_master_usernames.value[$s]' "$OUTPUTS")
            # A role da autenticacao vive so na instancia do orders (auth_database).
            RUN_AUTH_ROLE=$([ "$SERVICE" = "orders" ] && echo true || echo false)
            JOB="db-users-${SERVICE}"

            echo "=== ${SERVICE}: ${PGHOST}:${PGPORT}/${PGDATABASE} (usuario ${APP_USER}, role auth: ${RUN_AUTH_ROLE})"

            # Job e imutavel apos criado: um re-run sem isso falha com "already exists".
            kubectl delete job "$JOB" -n "$NAMESPACE" --ignore-not-found
            kubectl delete secret "${JOB}-secret" -n "$NAMESPACE" --ignore-not-found

            # Secret efemero: some no step de limpeza, esteja o job em sucesso ou falha.
            kubectl create secret generic "${JOB}-secret" \
              --namespace "$NAMESPACE" \
              --from-literal=master-password="${!MASTER_VAR}" \
              --from-literal=app-password="${!APP_VAR}" \
              --from-literal=auth-password="${AUTH_DB_PASSWORD}"

            cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: ${NAMESPACE}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: psql
                    # Mirror da AWS para o postgres oficial: evita o rate limit
                    # do Docker Hub para pulls anonimos.
                    image: public.ecr.aws/docker/library/postgres:16-alpine
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -e
                        psql -v ON_ERROR_STOP=1 \
                          -v service_user="\$APP_USER" \
                          -v service_password="\$APP_PASSWORD" \
                          -f /sql/service-user.sql
                        if [ "\$RUN_AUTH_ROLE" = "true" ]; then
                          psql -v ON_ERROR_STOP=1 \
                            -v auth_password="\$AUTH_DB_PASSWORD" \
                            -f /sql/auth-database-role.sql
                        fi
                    env:
                      - name: PGHOST
                        value: "${PGHOST}"
                      - name: PGPORT
                        value: "${PGPORT}"
                      - name: PGDATABASE
                        value: "${PGDATABASE}"
                      - name: PGUSER
                        value: "${PGUSER}"
                      - name: PGSSLMODE
                        value: "require"
                      - name: APP_USER
                        value: "${APP_USER}"
                      - name: RUN_AUTH_ROLE
                        value: "${RUN_AUTH_ROLE}"
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${JOB}-secret
                            key: master-password
                      - name: APP_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${JOB}-secret
                            key: app-password
                      - name: AUTH_DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${JOB}-secret
                            key: auth-password
                    volumeMounts:
                      - name: sql-scripts
                        mountPath: /sql
                volumes:
                  - name: sql-scripts
                    configMap:
                      name: db-users-sql
          EOF

            set +e
            kubectl wait --for=condition=complete --timeout=180s "job/${JOB}" -n "$NAMESPACE"
            WAIT_STATUS=$?
            set -e

            echo "--- Logs do Job ${JOB} ---"
            kubectl logs "job/${JOB}" -n "$NAMESPACE" --tail=200 || true

            if [ "$WAIT_STATUS" -ne 0 ]; then
              echo "::error::Job ${JOB} nao completou com sucesso. Ver logs acima."
              falhas="${falhas} ${SERVICE}"
            fi
          done

          if [ -n "$falhas" ]; then
            echo "::error::Falha nos servicos:${falhas}"
            exit 1
          fi

      - name: Limpar recursos dos Jobs
        if: always()
        run: |
          for SERVICE in $(jq -r '.databases.value | keys[]' "${RUNNER_TEMP}/tf-outputs.json" 2>/dev/null); do
            kubectl delete job "db-users-${SERVICE}" -n "$NAMESPACE" --ignore-not-found || true
            kubectl delete secret "db-users-${SERVICE}-secret" -n "$NAMESPACE" --ignore-not-found || true
          done
          kubectl delete configmap db-users-sql -n "$NAMESPACE" --ignore-not-found || true

      - name: Resumo
        run: |
          {
            echo "### Usuarios de banco"
            echo ""
            echo "| Servico | Banco | Usuario da aplicacao |"
            echo "| --- | --- | --- |"
            jq -r '.databases.value | to_entries[] | "| \(.key) | `\(.value.db_name)` | `\(.value.app_username)` |"' \
              "${RUNNER_TEMP}/tf-outputs.json"
            echo ""
            echo "Role \`mechanical_hub_auth\` (LOGIN + CONNECT) criada ou atualizada no banco do orders. O \`SELECT\` em \`users\`/\`profiles\` vem da migration do \`mechanical-hub-orders\`."
            echo ""
            echo "Proximo passo: deploy dos servicos com a senha do secret \`<SERVICO>_DB_APP_PASSWORD\`."
          } >> $GITHUB_STEP_SUMMARY
