name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        default: production
        type: choice
        options: [production, staging]
      criar_role_de_autenticacao:
        description: >-
          Executar sql/auth-database-role.sql apos o apply.
          So marque depois que as migrations Flyway V18..V20 do mechanical-hub
          tiverem rodado — elas criam users.document_number.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.5
  TF_DIR: infra

jobs:
  deploy:
    name: Provisionar banco de dados
    runs-on: ubuntu-latest

    outputs:
      rds-endpoint: ${{ steps.tf-outputs.outputs.rds_endpoint }}
      rds-port: ${{ steps.tf-outputs.outputs.rds_port }}
      rds-db-name: ${{ steps.tf-outputs.outputs.rds_db_name }}
      eks-cluster-name: ${{ steps.tf-outputs.outputs.eks_cluster_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Definir variaveis de state
        id: state
        run: |
          BUCKET="mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}"
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT
          echo "environment=${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_OUTPUT

      - name: Garantir bucket de state
        run: |
          aws s3api create-bucket \
            --bucket ${{ steps.state.outputs.bucket }} \
            --region ${{ env.AWS_REGION }} || true

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="key=mechanical-hub-database/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_infra_state_bucket: ${{ steps.state.outputs.bucket }}
          TF_VAR_environment: ${{ steps.state.outputs.environment }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar outputs do contrato
        id: tf-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "rds_port=$(terraform output -raw rds_port)" >> $GITHUB_OUTPUT
          echo "rds_db_name=$(terraform output -raw rds_db_name)" >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT

      - name: Resumo
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Banco provisionado"
            echo ""
            echo "| Output | Valor |"
            echo "| --- | --- |"
            echo "| rds_endpoint | \`$(terraform output -raw rds_endpoint)\` |"
            echo "| rds_port | \`$(terraform output -raw rds_port)\` |"
            echo "| rds_db_name | \`$(terraform output -raw rds_db_name)\` |"
            echo ""
            echo "State: \`s3://${{ steps.state.outputs.bucket }}/mechanical-hub-database/terraform.tfstate\`"
            echo ""
            echo "Consumidores (ADR-0002): \`mechanical-hub-auth\` e o pipeline de deploy de \`mechanical-hub\`."
          } >> $GITHUB_STEP_SUMMARY


  # ===========================================================================
  # Usuarios dos servicos e role de autenticacao — opcional, sob demanda
  # ===========================================================================
  #
  # Roda, em cada instancia RDS do output `databases`:
  #   - sql/service-user.sql      : usuario da aplicacao, dono do schema public
  #                                 (senha: secret <SERVICO>_DB_APP_PASSWORD);
  #   - sql/auth-database-role.sql: so na instancia do orders, role
  #                                 mechanical_hub_auth com LOGIN e CONNECT
  #                                 (senha: secret AUTH_DB_PASSWORD).
  #
  # Ordem do ambiente: apply -> este job -> deploy dos servicos. As migrations
  # do orders concedem o SELECT a mechanical_hub_auth e precisam da role.
  #
  # Os scripts sao idempotentes: em execucoes seguintes apenas atualizam senhas.
  #
  # O psql NAO roda direto neste runner: os RDS sao privados (publicly_accessible
  # = false, o security group so libera as subnets privadas — ADR-0002) e o
  # runner hospedado do GitHub Actions esta na internet publica, entao a
  # conexao sempre da "Connection timed out" na 5432. Os scripts rodam como
  # Jobs de curta duracao dentro do EKS, que ja esta na rede privada que os
  # bancos aceitam.
  database-users:
    name: Criar usuarios dos servicos e role de autenticacao
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.criar_role_de_autenticacao

    env:
      NAMESPACE: mechanical-hub-db-jobs

    steps:
      - uses: actions/checkout@v4

      - name: Conferir secrets obrigatorios
        env:
          DB_PASSWORD_ORDERS: ${{ secrets.DB_PASSWORD_ORDERS }}
          DB_PASSWORD_STOCK: ${{ secrets.DB_PASSWORD_STOCK }}
          DB_PASSWORD_BILLING: ${{ secrets.DB_PASSWORD_BILLING }}
          ORDERS_DB_APP_PASSWORD: ${{ secrets.ORDERS_DB_APP_PASSWORD }}
          STOCK_DB_APP_PASSWORD: ${{ secrets.STOCK_DB_APP_PASSWORD }}
          BILLING_DB_APP_PASSWORD: ${{ secrets.BILLING_DB_APP_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
        run: |
          faltando=""
          for nome in DB_PASSWORD_ORDERS DB_PASSWORD_STOCK DB_PASSWORD_BILLING \
                      ORDERS_DB_APP_PASSWORD STOCK_DB_APP_PASSWORD BILLING_DB_APP_PASSWORD \
                      AUTH_DB_PASSWORD; do
            if [ -z "${!nome}" ]; then faltando="${faltando} ${nome}"; fi
          done
          if [ -n "${faltando}" ]; then
            echo "::error::Secret(s) ausente(s):${faltando}"
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Os enderecos vem direto do state: o mapa `databases` nao cabe nos
      # outputs de job sem serializacao, e assim o job nao depende de como o
      # job de deploy publica os valores.
      - name: Ler outputs do state
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=mechanical-hub-database/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform output -json > "${RUNNER_TEMP}/tf-outputs.json"
          jq -r '.databases.value | to_entries[] | "\(.key): \(.value.endpoint)/\(.value.db_name) (\(.value.app_username))"' \
            "${RUNNER_TEMP}/tf-outputs.json"

      - name: Configurar kubectl
        run: |
          CLUSTER=$(jq -r '.eks_cluster_name.value // empty' "${RUNNER_TEMP}/tf-outputs.json")
          if [ -z "$CLUSTER" ]; then
            echo "::error::eks_cluster_name vazio: o state do mechanical-hub-infra nao foi lido no apply."
            exit 1
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region ${{ env.AWS_REGION }}

      - name: Executar scripts de sql/ via Jobs no EKS
        env:
          DB_PASSWORD_ORDERS: ${{ secrets.DB_PASSWORD_ORDERS }}
          DB_PASSWORD_STOCK: ${{ secrets.DB_PASSWORD_STOCK }}
          DB_PASSWORD_BILLING: ${{ secrets.DB_PASSWORD_BILLING }}
          ORDERS_DB_APP_PASSWORD: ${{ secrets.ORDERS_DB_APP_PASSWORD }}
          STOCK_DB_APP_PASSWORD: ${{ secrets.STOCK_DB_APP_PASSWORD }}
          BILLING_DB_APP_PASSWORD: ${{ secrets.BILLING_DB_APP_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
        run: |
          set -euo pipefail
          OUTPUTS="${RUNNER_TEMP}/tf-outputs.json"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete configmap db-users-sql -n "$NAMESPACE" --ignore-not-found
          kubectl create configmap db-users-sql \
            --namespace "$NAMESPACE" \
            --from-file=service-user.sql=sql/service-user.sql \
            --from-file=auth-database-role.sql=sql/auth-database-role.sql

          falhas=""
          for SERVICE in $(jq -r '.databases.value | keys[]' "$OUTPUTS"); do
            UPPER=$(echo "$SERVICE" | tr '[:lower:]' '[:upper:]')
            MASTER_VAR="DB_PASSWORD_${UPPER}"
            APP_VAR="${UPPER}_DB_APP_PASSWORD"
            if [ -z "${!MASTER_VAR:-}" ] || [ -z "${!APP_VAR:-}" ]; then
              echo "::error::Sem secrets ${MASTER_VAR}/${APP_VAR} para o servico ${SERVICE}."
              falhas="${falhas} ${SERVICE}"
              continue
            fi

            PGHOST=$(jq -r --arg s "$SERVICE" '.databases.value[$s].endpoint' "$OUTPUTS")
            PGPORT=$(jq -r --arg s "$SERVICE" '.databases.value[$s].port' "$OUTPUTS")
            PGDATABASE=$(jq -r --arg s "$SERVICE" '.databases.value[$s].db_name' "$OUTPUTS")
            APP_USER=$(jq -r --arg s "$SERVICE" '.databases.value[$s].app_username' "$OUTPUTS")
            PGUSER=$(jq -r --arg s "$SERVICE" '.rds_master_usernames.value[$s]' "$OUTPUTS")
            # A role da autenticacao vive so na instancia do orders (auth_database).
            RUN_AUTH_ROLE=$([ "$SERVICE" = "orders" ] && echo true || echo false)
            JOB="db-users-${SERVICE}"

            echo "=== ${SERVICE}: ${PGHOST}:${PGPORT}/${PGDATABASE} (usuario ${APP_USER}, role auth: ${RUN_AUTH_ROLE})"

            # Job e imutavel apos criado: um re-run sem isso falha com "already exists".
            kubectl delete job "$JOB" -n "$NAMESPACE" --ignore-not-found
            kubectl delete secret "${JOB}-secret" -n "$NAMESPACE" --ignore-not-found

            # Secret efemero: some no step de limpeza, esteja o job em sucesso ou falha.
            kubectl create secret generic "${JOB}-secret" \
              --namespace "$NAMESPACE" \
              --from-literal=master-password="${!MASTER_VAR}" \
              --from-literal=app-password="${!APP_VAR}" \
              --from-literal=auth-password="${AUTH_DB_PASSWORD}"

            cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: ${NAMESPACE}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: psql
                    # Mirror da AWS para o postgres oficial: evita o rate limit
                    # do Docker Hub para pulls anonimos.
                    image: public.ecr.aws/docker/library/postgres:16-alpine
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -e
                        psql -v ON_ERROR_STOP=1 \
                          -v service_user="\$APP_USER" \
                          -v service_password="\$APP_PASSWORD" \
                          -f /sql/service-user.sql
                        if [ "\$RUN_AUTH_ROLE" = "true" ]; then
                          psql -v ON_ERROR_STOP=1 \
                            -v auth_password="\$AUTH_DB_PASSWORD" \
                            -f /sql/auth-database-role.sql
                        fi
                    env:
                      - name: PGHOST
                        value: "${PGHOST}"
                      - name: PGPORT
                        value: "${PGPORT}"
                      - name: PGDATABASE
                        value: "${PGDATABASE}"
                      - name: PGUSER
                        value: "${PGUSER}"
                      - name: PGSSLMODE
                        value: "require"
                      - name: APP_USER
                        value: "${APP_USER}"
                      - name: RUN_AUTH_ROLE
                        value: "${RUN_AUTH_ROLE}"
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${JOB}-secret
                            key: master-password
                      - name: APP_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${JOB}-secret
                            key: app-password
                      - name: AUTH_DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${JOB}-secret
                            key: auth-password
                    volumeMounts:
                      - name: sql-scripts
                        mountPath: /sql
                volumes:
                  - name: sql-scripts
                    configMap:
                      name: db-users-sql
          EOF

            set +e
            kubectl wait --for=condition=complete --timeout=180s "job/${JOB}" -n "$NAMESPACE"
            WAIT_STATUS=$?
            set -e

            echo "--- Logs do Job ${JOB} ---"
            kubectl logs "job/${JOB}" -n "$NAMESPACE" --tail=200 || true

            if [ "$WAIT_STATUS" -ne 0 ]; then
              echo "::error::Job ${JOB} nao completou com sucesso. Ver logs acima."
              falhas="${falhas} ${SERVICE}"
            fi
          done

          if [ -n "$falhas" ]; then
            echo "::error::Falha nos servicos:${falhas}"
            exit 1
          fi

      - name: Limpar recursos dos Jobs
        if: always()
        run: |
          for SERVICE in $(jq -r '.databases.value | keys[]' "${RUNNER_TEMP}/tf-outputs.json" 2>/dev/null); do
            kubectl delete job "db-users-${SERVICE}" -n "$NAMESPACE" --ignore-not-found || true
            kubectl delete secret "db-users-${SERVICE}-secret" -n "$NAMESPACE" --ignore-not-found || true
          done
          kubectl delete configmap db-users-sql -n "$NAMESPACE" --ignore-not-found || true

      - name: Resumo
        run: |
          {
            echo "### Usuarios de banco"
            echo ""
            echo "| Servico | Banco | Usuario da aplicacao |"
            echo "| --- | --- | --- |"
            jq -r '.databases.value | to_entries[] | "| \(.key) | `\(.value.db_name)` | `\(.value.app_username)` |"' \
              "${RUNNER_TEMP}/tf-outputs.json"
            echo ""
            echo "Role \`mechanical_hub_auth\` (LOGIN + CONNECT) criada ou atualizada no banco do orders. O \`SELECT\` em \`users\`/\`profiles\` vem da migration do \`mechanical-hub-orders\`."
            echo ""
            echo "Proximo passo: deploy dos servicos com a senha do secret \`<SERVICO>_DB_APP_PASSWORD\`."
          } >> $GITHUB_STEP_SUMMARY
