name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.7.5
  TF_DIR: infra

jobs:
  validate:
    name: Terraform fmt, validate e plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init (backend local — sem AWS)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform validate — modulo mongodb
        working-directory: ${{ env.TF_DIR }}/modules/mongodb
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # `terraform test` so procura arquivos diretamente em tests/; os testes
      # ficam em subpastas, por isso o -test-directory (sem ele o comando
      # termina com "0 passed" e nao testa nada). O init precisa do mesmo
      # parametro para instalar os modulos referenciados pelos runs.
      #
      # Cobre: regiao, resolucao de rede, modulo rds, bancos por servico e
      # contrato de outputs (databases_unit) e o StatefulSet do MongoDB
      # (mongodb_unit). Todos com mock_provider, sem AWS nem cluster.
      - name: Testes unitarios
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false -input=false -test-directory=tests/unit
          terraform test -test-directory=tests/unit -verbose

  integration:
    name: Testes de integracao (LocalStack)
    runs-on: ubuntu-latest
    needs: validate

    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,rds,sts
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Teste de integracao dos bancos por servico
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false -input=false -test-directory=tests/integration
          terraform test -test-directory=tests/integration -verbose

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=mechanical-hub-database/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      # O provider kubernetes (MongoDB) usa `aws eks get-token` com estas
      # mesmas credenciais; o cluster vem do state do mechanical-hub-infra.
      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          DB_PASSWORD_ORDERS: ${{ secrets.DB_PASSWORD_ORDERS }}
          DB_PASSWORD_STOCK: ${{ secrets.DB_PASSWORD_STOCK }}
          DB_PASSWORD_BILLING: ${{ secrets.DB_PASSWORD_BILLING }}
          TF_VAR_infra_state_bucket: mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          export TF_VAR_db_passwords=$(jq -cn \
            --arg orders "$DB_PASSWORD_ORDERS" \
            --arg stock "$DB_PASSWORD_STOCK" \
            --arg billing "$DB_PASSWORD_BILLING" \
            '{orders: $orders, stock: $stock, billing: $billing}')
          terraform plan -input=false -no-color
