name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.7.5
  TF_DIR: infra

jobs:
  validate:
    name: Terraform fmt, validate e plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init (backend local — sem AWS)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Testes unitarios — validacao de regiao
        working-directory: ${{ env.TF_DIR }}
        run: terraform test -filter=tests/unit/region_unit.tftest.hcl

      - name: Testes unitarios — resolucao de rede
        working-directory: ${{ env.TF_DIR }}
        run: terraform test -filter=tests/unit/network_unit.tftest.hcl

      - name: Testes unitarios — modulo RDS
        working-directory: ${{ env.TF_DIR }}
        run: terraform test -filter=tests/unit/rds_unit.tftest.hcl

  integration:
    name: Testes de integracao (LocalStack)
    runs-on: ubuntu-latest
    needs: validate

    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,rds,sts
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (backend local — sem AWS)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false -input=false

      - name: Teste de integracao do modulo RDS
        working-directory: ${{ env.TF_DIR }}
        run: terraform test -filter=tests/integration/rds_integration.tftest.hcl

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=mechanical-hub-database/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_infra_state_bucket: mechanical-hub-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
        run: terraform plan -input=false -no-color
